name: Build PSP game

on:
  push:
    branches:
      - main
      - "dev/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: pspdev/pspdev:latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Compile PSP executable
        run: make clean && make
      - name: Package game and opening artwork
        run: |
          mkdir -p release/assets
          cp EBOOT.PBP release/
          cp assets/*.jpg release/assets/
          cd release
          zip -r ../SaibaUltimate-PSP.zip .
      - name: Publish PSP package artifact
        uses: actions/upload-artifact@v4
        with:
          name: SaibaUltimate-PSP
          path: SaibaUltimate-PSP.zip
          if-no-files-found: error
